name: SelfHeal - Auto Test Repair

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  test-and-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Tests + SelfHeal

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install git+https://github.com/wiwo-wuming/selfheal.git

      - name: Run tests
        id: pytest
        continue-on-error: true
        run: |
          python -m pytest tests/ -v --tb=short --json-report --json-report-file=pytest-results.json 2>&1 && echo "failed=false" >> "$GITHUB_OUTPUT" || echo "failed=true" >> "$GITHUB_OUTPUT"

      - name: SelfHeal - Auto repair on failure
        if: always()
        shell: python
        run: |
          import json, sys, subprocess
          with open("pytest-results.json") as f:
              report = json.load(f)
          failures = []
          for test in report.get("tests", []):
              if test["outcome"] in ("failed", "error"):
                  longrepr = test.get("call", {}).get("longrepr", "") or ""
                  failures.append({
                      "test_path": test.get("nodeid", ""),
                      "error_type": "RuntimeError" if "assert" not in longrepr else "AssertionError",
                      "error_message": longrepr[:500],
                      "traceback": longrepr,
                  })
          if not failures:
              print("All tests passed, skipping self-heal")
              sys.exit(0)
          print(f"Found {len(failures)} failure(s), running self-heal...")
          with open("failures.json", "w") as f:
              json.dump(failures, f)
          subprocess.run(
              ["python", "-m", "selfheal", "batch", "--input", "failures.json",
               "--dry-run", "--config", "selfheal.yaml"],
              check=False,
          )

      - name: Upload selfheal artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfheal-results
          path: |
            pytest-results.json
            failures.json
          retention-days: 7
